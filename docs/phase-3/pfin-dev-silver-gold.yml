# ============================================================
# PFIN — Lakeflow Job: pfin-dev-silver-gold
# Phase 3: Silver → Gold aggregation
# ============================================================

resources:
  jobs:
    pfin_dev_silver_gold:
      name: pfin-dev-silver-gold
      description: "Phase 3 — Aggregate Silver tables into Gold Delta tables (pfin_dev catalog)"

      # ── Compute ─────────────────────────────────────────
      job_clusters:
        - job_cluster_key: gold_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: Standard_D4ds_v5
            num_workers: 2
            spark_conf:
              "spark.databricks.delta.preview.enabled": "true"
            data_security_mode: SINGLE_USER
      # Alternatively, use serverless by removing job_clusters above
      # and setting: environments: - environment_key: default
      #                               spec: { client: "2" }

      # ── Tasks ────────────────────────────────────────────
      tasks:
        - task_key: aggregate_gold
          description: "Run Gold aggregation notebook"
          job_cluster_key: gold_cluster
          notebook_task:
            notebook_path: ../src/aggregation/03_aggregate_gold
            source: WORKSPACE
          timeout_seconds: 1800
          retry_on_timeout: false
          max_retries: 1
          min_retry_interval_millis: 60000

      # ── Schedule (dev: manual; prod: daily) ──────────────
      # Uncomment for prod job (pfin-prod-silver-gold):
      # schedule:
      #   quartz_cron_expression: "0 30 4 * * ?"   # 04:30 UTC daily
      #   timezone_id: "America/Toronto"
      #   pause_status: UNPAUSED

      # ── Notifications ────────────────────────────────────
      email_notifications:
        on_failure:
          - arsalan@example.com    # replace with actual email
        no_alert_for_skipped_runs: true

      # ── Tags ─────────────────────────────────────────────
      tags:
        project: pfin
        phase: "3"
        layer: gold
        environment: dev
